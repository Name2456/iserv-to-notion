name: IServ to Notion Sync

on:
  schedule:
    # Mo–Fr alle 30 Minuten, 7:00–20:30 Uhr MESZ (5–18 UTC)
    - cron: '*/30 5-18 * * 1-5'
    # Sa/So einmal morgens (9:13 Uhr MESZ)
    - cron: '13 7 * * 0,6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iserv-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          ISERV_USERNAME: ${{ secrets.ISERV_USERNAME }}
          ISERV_PASSWORD: ${{ secrets.ISERV_PASSWORD }}
          ISERV_URL: ${{ secrets.ISERV_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_MESSENGER_DATABASE_ID: ${{ secrets.NOTION_MESSENGER_DATABASE_ID }}
        run: python sync.py
