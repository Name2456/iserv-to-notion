name: IServ to Notion Sync

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          ISERV_USERNAME: ${{ secrets.ISERV_USERNAME }}
          ISERV_PASSWORD: ${{ secrets.ISERV_PASSWORD }}
          ISERV_URL: ${{ secrets.ISERV_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python sync.py
