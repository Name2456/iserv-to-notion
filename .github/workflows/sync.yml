name: IServ to Notion Sync

on:
  schedule:
    # Runs daily at 06:00 UTC = 08:00 CET / 07:00 UTC+1 (Berlin)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          ISERV_USERNAME: ${{ secrets.ISERV_USERNAME }}
          ISERV_PASSWORD: ${{ secrets.ISERV_PASSWORD }}
          ISERV_URL: ${{ secrets.ISERV_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python sync.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iserv-debug
          path: |
            debug_raw_response.html
            debug_parsed_data.json
            debug_script_content.txt
          if-no-files-found: ignore
